# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLOv8 object detection model with P3-P5 outputs. For Usage examples see https://docs.ultralytics.com/tasks/detect

# Parameters
ch: 6
nc: 5  # number of classes
scale: s
scales: 
   s: [0.33, 0.50, 1024]  

backbone:
  # [from, repeats, module, args]
  - [-1, 1, IN, []]  # 0
  - [-1, 1, Multiin, [1]]  # 1
  - [-2, 1, Multiin, [2]]  # 2

  - [-2, 1, Conv, [64, 3, 2]]  # 3-P1/2
  - [-2, 1, Conv, [64, 3, 2]]

  - [-2, 1, Conv, [128, 3, 2]]  # 5-P2/4
  - [-2, 1, Conv, [128, 3, 2]]

  - [-2, 2, CAFEM, [256]]
  - [-2, 2, CAFEM, [256]]

  - [[-2, -1], 1, TGF, [256, 8, 8, 2, 8, 2, 0.0, 0.0, 0.0, 2, 4, 0.4, 0.4]] # 9
  - [[-3,-1], 1, Add2, [256,0]]    # 10
  - [[-3,-2], 1, Add2, [256,1]]    # 11

  - [[-2, -1], 1, Concat, [1]]

  - [-1, 1, Conv, [256, 3, 2]]  # 13
  - [-1, 1, CAFEM, [512]] # 14
 
  - [-1, 1, Conv, [512, 3, 2 ] ]  # 15
  - [-1, 2, CAFEM, [512]]

  - [-1, 1, Conv, [1024, 3, 2 ] ]  # 17
  - [-1, 3, CAFEM, [1024]]
  - [-1, 1, SPPF, [1024, 5]]          
  - [-1, 2, C2PSA, [1024]] # 20


head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 16], 1, Concat, [1]]  # cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 23
 
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 14], 1, Concat, [1]]  # cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 26 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 23], 1, Concat, [1]]  # cat head P4
  - [-1, 2, C3k2, [512, False]] # 29 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 20], 1, Concat, [1]]  # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 32 (P5/32-large)

  - [[26, 29, 32], 1, OBB, [nc, 1]]  # Detect(P3, P4, P5)
  