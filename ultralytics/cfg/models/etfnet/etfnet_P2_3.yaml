# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLOv8 object detection model with P3-P5 outputs. For Usage examples see https://docs.ultralytics.com/tasks/detect

# Parameters
ch: 6
nc: 5  # number of classes
scale: s
scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
  # [depth, width, max_channels]
   s: [0.33, 0.50, 1024]  # YOLOv8s summary: 225 layers, 11166560 parameters, 11166544 gradients,  28.8 GFLOPs
  
backbone:
  # [from, repeats, module, args]
  - [-1, 1, IN, []]  # 0
  - [-1, 1, Multiin, [1]]  # 1
  - [-2, 1, Multiin, [2]]  # 2

  - [-2, 1, Conv, [64, 3, 2]]  # 3-P1/2
  - [-2, 1, Conv, [64, 3, 2]]

  - [-2, 1, Conv, [128, 3, 2]]  # 5-P2/4
  - [-2, 1, Conv, [128, 3, 2]]

  - [-2, 2, CAFEM, [256]]
  - [-2, 2, CAFEM, [256]]

  - [[-2, -1], 1, TGF, [256, 8, 8, 2, 4, 2, 0.0, 0.0, 0.0, 2, 4, 0.4, 0.4]]
  - [[-3,-1], 1, Add2, [256,0]]    # 10
  - [[-3,-2], 1, Add2, [256,1]]    # 11

  - [-2, 1, Conv, [256, 3, 2]]  # 12
  - [-2, 1, Conv, [256, 3, 2]]

  - [-2, 1, CAFEM, [512]] # 14
  - [-2, 1, CAFEM, [512]]

  - [[-2, -1], 1, TGF, [512, 8, 8, 2, 8, 2, 0.0, 0.0, 0.0, 2, 4, 0.3, 0.3]]
  - [[-3,-1], 1, Add2, [512,0]]    
  - [[-3,-2], 1, Add2, [512,1]]    

  - [[-2, -1], 1, Concat, [1]]
 
  - [-1, 1, Conv, [512, 3, 2 ] ]  
  - [-1, 2, CAFEM, [512]]

  - [-1, 1, Conv, [1024, 3, 2 ] ]  
  - [-1, 3, CAFEM, [1024]]
  - [-1, 1, SPPF, [1024, 5]]          
  - [-1, 2, C2PSA, [1024]] 


head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 21], 1, Concat, [1]]  # cat backbone P4
  - [-1, 2, C3k2, [512, False]] 
 
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 19], 1, Concat, [1]]  # cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 31 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 28], 1, Concat, [1]]  # cat head P4
  - [-1, 2, C3k2, [512, False]] # 34 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 25], 1, Concat, [1]]  # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 37 (P5/32-large)

  - [[31, 34, 37], 1, OBB, [nc, 1]]  # Detect(P3, P4, P5)
 