# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLOv8 object detection model with P3-P5 outputs

# Parameters
ch: 6
nc: 5

scale: s
scales:
  s: [0.33, 0.50, 1024] 

backbone:
  # [from, repeats, module, args]
  - [-1, 1, IN, []]                      # 0
  - [-1, 1, Multiin, [1]]                # 1
  - [-2, 1, Multiin, [2]]                # 2

  - [-2, 1, Conv, [64, 3, 2]]            # 3-P1/2
  - [-2, 1, Conv, [64, 3, 2]]            # 4

  - [-2, 1, Conv, [128, 3, 2]]           # 5-P2/4
  - [-2, 1, Conv, [128, 3, 2]]           # 6

  - [-2, 2, C2f, [128, True]]            # 7
  - [-2, 2, C2f, [128, True]]            # 8

  - [[-2, -1], 1, TGF, [128, 8, 8, 2, 8, 2, 0.0, 0.0, 0.0, 2, 4, 0.4, 0.4]]  # 9
  - [[-3, -1], 1, Add2, [256, 0]]                # 10
  - [[-3, -2], 1, Add2, [256, 1]]                # 11

  - [-2, 1, Conv, [256, 3, 2]]           # 12-P3/8
  - [-2, 1, Conv, [256, 3, 2]]           # 13

  - [-2, 3, C2f, [256, True]]            # 14
  - [-2, 3, C2f, [256, True]]            # 15

  - [[-2, -1], 1, Concat, [1]]               # 16

  - [-1, 1, Conv, [512, 3, 2]]           # 17-P4/16
  - [-1, 3, C2f, [512, True]]            # 18

  - [-1, 1, Conv, [1024, 3, 2]]          # 19-P5/32
  - [-1, 3, C2f, [1024, True]]           # 20
  - [-1, 1, SPPF, [1024, 5]]             # 21
  - [-1, 2, C2PSA, [1024]]               # 22

head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 23
  - [[-1, 18], 1, Concat, [1]]                  # 24 cat backbone P4
  - [-1, 3, C2f, [512]]                         # 25

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 26
  - [[-1, 16], 1, Concat, [1]]                  # 27 cat backbone P3
  - [-1, 3, C2f, [256]]                         # 28 P3/8-small

  - [-1, 1, Conv, [256, 3, 2]]                  # 29
  - [[-1, 25], 1, Concat, [1]]                  # 30 cat head P4
  - [-1, 3, C2f, [512]]                         # 31 P4/16-medium

  - [-1, 1, Conv, [512, 3, 2]]                  # 32
  - [[-1, 22], 1, Concat, [1]]                  # 33 cat head P5
  - [-1, 3, C2f, [1024]]                        # 34 P5/32-large

  - [[28, 31, 34], 1, OBB, [nc, 1]]             # 35 Detect(P3, P4, P5)