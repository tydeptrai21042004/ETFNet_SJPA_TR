# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLOv8 object detection model with P3-P5 outputs. For Usage examples see https://docs.ultralytics.com/tasks/detect

# Parameters
ch: 6
nc: 5  # number of classes
scale: s
scales: 
   s: [0.33, 0.50, 1024]  

backbone:
  # [from, repeats, module, args]
  - [-1, 1, IN, []]  # 0
  - [-1, 1, Multiin, [1]]  # 1
  - [-2, 1, Multiin, [2]]  # 2

  - [-2, 1, Conv, [64, 3, 2]]  # 3-P1/2
  - [-2, 1, Conv, [64, 3, 2]]

  - [-2, 1, Conv, [128, 3, 2]]  # 5-P2/4
  - [-2, 1, Conv, [128, 3, 2]]

  - [-2, 2, C3k2, [256, False, 0.25]] # 7
  - [-2, 2, C3k2, [256, False, 0.25]]

  - [-2, 1, Conv, [256, 3, 2]]  # 9-P3/8
  - [-2, 1, Conv, [256, 3, 2]]

  - [-2, 2, C3k2, [512, False, 0.25]] # 11
  - [-2, 2, C3k2, [512, False, 0.25]]

  - [[-2, -1], 1, Add, [1]]  
 
  - [-1, 1, Conv, [512, 3, 2 ] ]  # 14-P4/16
  - [-1, 2, C3k2, [512, True]]

  - [-1, 1, Conv, [1024, 3, 2 ] ]  # 16-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]         
  - [-1, 2, C2PSA, [1024]] # 19

head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 15], 1, Concat, [1]]  # cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 22
 
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 13], 1, Concat, [1]]  # cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 25 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 22], 1, Concat, [1]]  # cat head P4
  - [-1, 2, C3k2, [512, False]] # 28 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 19], 1, Concat, [1]]  # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 31 (P5/32-large)

  - [[25, 28, 31], 1, OBB, [nc, 1]]  # Detect(P3, P4, P5)
