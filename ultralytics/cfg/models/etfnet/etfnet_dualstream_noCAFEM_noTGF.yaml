# Fair six-channel RGB-IR ablation: dual streams, no CAFEM, no TGF/SJPA.
# The modalities are independently encoded through P2 and then concatenated.
scale: s
ch: 6
nc: 5
scales:
  s: [0.33, 0.50, 1024]

backbone:
  - [-1, 1, IN, []]                          # 0: six-channel input
  - [-1, 1, Multiin, [1]]                    # 1: RGB
  - [-2, 1, Multiin, [2]]                    # 2: IR

  - [-2, 1, Conv, [64, 3, 2]]                # 3
  - [-2, 1, Conv, [64, 3, 2]]                # 4
  - [-2, 1, Conv, [128, 3, 2]]               # 5
  - [-2, 1, Conv, [128, 3, 2]]               # 6
  - [-2, 2, C3k2, [256, False, 0.25]]        # 7
  - [-2, 2, C3k2, [256, False, 0.25]]        # 8

  - [[-2, -1], 1, Concat, [1]]               # 9: parameter-free P2 fusion
  - [-1, 1, Conv, [256, 3, 2]]               # 10: P3
  - [-1, 2, C3k2, [512, False, 0.25]]        # 11
  - [-1, 1, Conv, [512, 3, 2]]               # 12: P4
  - [-1, 2, C3k2, [512, True]]               # 13
  - [-1, 1, Conv, [1024, 3, 2]]              # 14: P5
  - [-1, 3, C3k2, [1024, True]]              # 15
  - [-1, 1, SPPF, [1024, 5]]                 # 16
  - [-1, 2, C2PSA, [1024]]                   # 17

head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]              # 20
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]              # 23
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 20], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]              # 26
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 17], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]              # 29
  - [[23, 26, 29], 1, OBB, [nc, 1]]
