# Experimental stronger proposal: Dual-Coordinate Safe Procrustes Fusion (DCSPF-Guard).
# Fair control: same C3k2 backbone as dual_concat and corrected SJPA; only layer 9 differs.
# The raw and canonical experts use identity-initialized grouped 1x1 adapters.
scale: s
ch: 6
nc: 5
scales:
  s: [0.33, 0.50, 1024]

backbone:
  - [-1, 1, IN, []]
  - [-1, 1, Multiin, [1]]
  - [-2, 1, Multiin, [2]]
  - [-2, 1, Conv, [64, 3, 2]]
  - [-2, 1, Conv, [64, 3, 2]]
  - [-2, 1, Conv, [128, 3, 2]]
  - [-2, 1, Conv, [128, 3, 2]]
  - [-2, 2, C3k2, [256, False, 0.25]]
  - [-2, 2, C3k2, [256, False, 0.25]]
  # groups, anchors, momentum, eps, reliability, reliability_gamma,
  # trigger_tau, trigger_k, max_shift, shift_penalty, score_threshold,
  # shift_margin, coherence_tau, typicality_tau, dominance_tau
  - [[-2, -1], 1, DCSPF, [32, 8, 0.03, 0.001, True, 1.5, 0.6, 12.0, 1, 0.03, 0.3, 0.02, 0.35, 0.6, 0.8]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 20], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 17], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]
  - [[23, 26, 29], 1, OBB, [nc, 1]]
