# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLOv8 object detection model with P3-P5 outputs. For Usage examples see https://docs.ultralytics.com/tasks/detect

# Parameters
ch: 6
nc: 5  # number of classes
scale: s
scales:
   s: [0.33, 0.50, 1024]  

backbone:
  # [from, repeats, module, args]
  - [-1, 1, IN, []]  # 0
  - [-1, 1, Multiin, [1]]  # 1
  - [-2, 1, Multiin, [2]]  # 2

  - [-2, 1, Conv, [64, 3, 2]]  
  - [-2, 1, Conv, [64, 3, 2]]

  - [-2, 1, Conv, [128, 3, 2]]  
  - [-2, 1, Conv, [128, 3, 2]]

  - [-2, 1, CAFEM, [256]] 
  - [-2, 1, CAFEM, [256]] 

  - [-2, 1, Conv, [256, 3, 2]]  
  - [-2, 1, Conv, [256, 3, 2]]

  - [-2, 1, CAFEM, [512]] # 11
  - [-2, 1, CAFEM, [512]]

  - [[-2, -1], 1, TGF, [256, 8, 8, 3, 4, 2, 0.0, 0.0, 0.0, 2, 4, 0.4, 0.4]] # 13
  - [[-3,-1], 1, Add2, [256,0]]    
  - [[-3,-2], 1, Add2, [256,1]]    

  - [[-2, -1], 1, Concat, [1]] 
 
  - [-3, 1, Conv, [512, 3, 2 ] ]  
  - [-3, 1, Conv, [512, 3, 2 ] ]  

  - [-2, 2, CAFEM, [512]] #
  - [-2, 2, CAFEM, [512]]

  - [[-2, -1], 1, TGF, [512, 8, 8, 2, 8, 2, 0.0, 0.0, 0.0, 2, 4, 0.3, 0.3]] # 21
  - [[-3,-1], 1, Add2, [512,0]]    
  - [[-3,-2], 1, Add2, [512,1]]    

  - [[-2, -1], 1, Concat, [1]] 

  - [-3, 1, Conv, [1024, 3, 2 ] ]  
  - [-3, 1, Conv, [1024, 3, 2 ] ]  

  - [-2, 2, CAFEM, [1024]] 
  - [-2, 2, CAFEM, [1024]]

  - [-2, 1, SPPF, [1024, 5]]    
  - [-2, 1, SPPF, [1024, 5]]  
        
  - [-2, 2, C2PSA, [1024]] 
  - [-2, 2, C2PSA, [1024]]

  - [[-2,-1], 1, TGF, [1024, 8, 8, 2, 8, 2, 0.0, 0.0, 0.0, 2, 4, 0.3, 0.3]] 
  - [[-3,-1], 1, Add2, [1024,0]]    
  - [[-3,-2], 1, Add2, [1024,1]]   

  - [[-2, -1], 1, Concat, [1]] 

head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 24], 1, Concat, [1]]  # cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 39
 
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 16], 1, Concat, [1]]  # cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 42 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 39], 1, Concat, [1]]  # cat head P4
  - [-1, 2, C3k2, [512, False]] # 45 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 36], 1, Concat, [1]]  # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 48 (P5/32-large)

  - [[42, 45, 48], 1, OBB, [nc, 1]]  # Detect(P3, P4, P5)
  